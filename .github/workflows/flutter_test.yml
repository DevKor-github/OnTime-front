name: Flutter Testing
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - "release/**"
      - "hotfix/**"
  push:
    branches:
      - main
      - "release/**"
      - "hotfix/**"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Android notification manifest contract
        run: |
          python3 -B -m unittest discover -s test/tool -p 'test_*.py' -v
          python3 tool/check_android_notification_manifest.py android/app/src/main/AndroidManifest.xml
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
          cache: true
      - name: install native test dependencies
        run: sudo apt-get install sqlite3 libsqlite3-dev libsodium-dev
      - name: Install packages
        run: flutter pub get
      - name: Check Flutter version
        run: flutter --version
      - name: Run generator
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Check historical database schema contracts
        run: dart run tool/check_database_schema.dart
      - name: Check generated Dart policy
        run: dart run tool/check_generated_dart_policy.dart
      - name: Check local-only product boundary
        run: dart run tool/check_local_only_boundary.dart
      - name: Analyze
        run: flutter analyze
      - name: Check Figma UI inventory and reference images
        # Flutter goldens are generated review evidence and are intentionally
        # not committed. CI still validates every route/state, tracked Figma
        # reference hash, and the declared golden path.
        run: >-
          dart run tool/report_figma_ui_coverage.dart
          --strict
          --allow-missing-goldens
      - name: Run test with coverage
        run: flutter test --coverage
      - name: Check coverage
        run: dart run tool/check_coverage.dart --min=80
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn
