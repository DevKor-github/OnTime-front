name: Flutter Testing
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - "release/**"
      - "hotfix/**"
  push:
    branches:
      - main
      - "release/**"
      - "hotfix/**"
jobs:
  test:
    # Real-font goldens are reviewed on macOS. Keep the rendering platform
    # aligned with those baselines; cross-OS rasterization is not identical.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
          cache: true
      - name: install native test dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install sqlite libsodium
      - name: Install packages
        run: flutter pub get
      - name: Check Flutter version
        run: flutter --version
      - name: Run generator
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Check generated Dart policy
        run: dart run tool/check_generated_dart_policy.dart
      - name: Check local-only product boundary
        run: dart run tool/check_local_only_boundary.dart
      - name: Analyze
        run: flutter analyze
      - name: Check Figma UI inventory and reference images
        run: dart run tool/report_figma_ui_coverage.dart --strict
      - name: Run test with coverage
        run: flutter test --coverage
      - name: Check coverage
        run: dart run tool/check_coverage.dart --min=80
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn
      - name: Upload golden failure images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-golden-failures
          path: test/**/failures/*.png
          if-no-files-found: ignore
